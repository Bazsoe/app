    if (fresh.length) parts.push(plural(fresh.length) + ' importálva');
    if (dup) parts.push(plural(dup) + ' már megvolt');
    if (res.errors.length) parts.push(plural(res.errors.length).replace('tétel', 'hibás sor') + ' kihagyva');
    if (!parts.length) parts.push('Nem található importálható tétel');
    var lines = [h('p', { text: parts.join(', ') + '.' })];
    if (res.errors.length) {
      lines.push(h('ul', { style: 'margin-top:4px' }, res.errors.slice(0, 5).map(function (er) {
        return h('li', { text: (er.line ? er.line + '. sor: ' : '') + (er.message || String(er)) });
      })));
      if (res.errors.length > 5) lines.push(h('p', { text: '… és még ' + (res.errors.length - 5) + ' hiba.' }));
    }
    s.msg.appendChild(h('div', null, lines));
    if (fresh.length) {
      setState(Object.assign({}, state, { expenses: state.expenses.concat(fresh) }));
      s.imp.value = '';
      render();
      toast(plural(fresh.length) + ' importálva.');
    } else toast(res.errors.length ? 'Az importálás nem sikerült. A részletek a mező alatt vannak.' : 'Nem került sor új tételre.', true);
  }
  function copyCsv() {
    var ta = els.set.exp;
    ta.value = L.toCSV(state);
    function manual() {
      try { ta.focus(); ta.select(); if (document.execCommand && document.execCommand('copy')) { toast('CSV a vágólapra másolva.'); return; } } catch (e) { /* tovább */ }
      try { ta.focus(); ta.select(); } catch (e2) { /* nincs mit tenni */ }
      toast('A vágólap nem érhető el. A szöveg ki van jelölve, másolja ki.', true);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(function () { toast('CSV a vágólapra másolva.'); }, manual);
      else manual();
    } catch (e) { manual(); }
  }

  /* ---------- Fájlmentés: Capacitor, Web Share, letöltés ---------- */
  function isNative() {
    try { return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); } catch (e) { return false; }
  }
  function isCancel(e) { return !!e && (e.name === 'AbortError' || /cancel/i.test(String(e.message || e))); }
  function blobToBase64(blob) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { var t = String(r.result); res(t.slice(t.indexOf(',') + 1)); };
      r.onerror = function () { rej(r.error); };
      r.readAsDataURL(blob);
    });
  }
  function viaCapacitor(blob, name) {
    if (!isNative()) return null;
    var pl = window.Capacitor.Plugins || {};
    if (!pl.Filesystem || !pl.Share) return null;
    return blobToBase64(blob).then(function (b64) {
      return pl.Filesystem.writeFile({ path: name, data: b64, directory: 'CACHE' });
    }).then(function (w) {
      return pl.Share.share({ title: 'Autó költségnapló mentése', url: w.uri, dialogTitle: 'Mentés fájlba' });
    }).then(function () { return { how: 'native' }; });
  }
  function viaShare(blob, name) {
    if (!(navigator.share && navigator.canShare)) return null;
    var f = new File([blob], name, { type: 'application/json' });
    if (!navigator.canShare({ files: [f] })) return null;
    return navigator.share({ files: [f], title: name }).then(function () { return { how: 'share' }; });
  }
  function viaDownload(blob, name) {
    if (!('download' in document.createElement('a')) || !window.URL || !URL.createObjectURL) return null;
    var url = URL.createObjectURL(blob);
    var a = h('a', { href: url, download: name, hidden: true });
    document.body.appendChild(a);
    try { a.click(); } finally {
      if (a.parentNode) a.parentNode.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    }
    return { how: 'download' };
  }
  function saveFile(blob, name) {
    return [viaCapacitor, viaShare, viaDownload].reduce(function (chain, fn) {
      return chain.then(function (r) {
        if (r) return r;
        return new Promise(function (res) { res(fn(blob, name)); }).then(null, function (e) { return isCancel(e) ? { how: 'cancelled' } : null; });
      });
    }, Promise.resolve(null)).then(function (r) { return r || { how: 'none' }; });
  }

  function doBackup() {
    if (ui.busy || !photosOk()) return;
    setBusy('Mentés készítése…');
    var name = 'autokoltseg-mentes-' + L.today() + '.json';
    var nExp = state.expenses.length, nPh = L.photoIdsOf(state).length;
    P.exportBundle(state).then(function (blob) {
      els.set.progLabel.textContent = 'Fájl mentése…';
      return saveFile(blob, name).then(function (r) { r.size = blob.size; return r; });
    }).then(function (r) {
      var info = plural(nExp) + ', ' + L.formatNum(nPh, 0) + ' kép, ' + fmtBytes(r.size);
      if (r.how === 'native' || r.how === 'share') backupNote('Mentés kész (' + info + '). A megosztási lapon válassza ki, hová kerüljön a fájl.');
      else if (r.how === 'download') backupNote('A fájl letöltése elindult: ' + name + ' (' + info + '). Ha nem találja a letöltések között, ez a környezet nem engedi a fájlmentést.');
      else if (r.how === 'cancelled') backupNote('A mentés megszakítva.');
      else backupNote('Ebben a környezetben nem menthető fájl. A CSV szövegmezőből másolhatja ki az adatokat (képek nélkül).', true);
    }, function (e) {
      backupNote('A mentés nem sikerült: ' + (e && e.message ? e.message : 'ismeretlen hiba') + '.', true);
    }).then(function () { setBusy(null); });
  }
  function onRestoreFile() {
    var s = els.set, file = s.json.files && s.json.files[0];
    if (!file || ui.busy || !photosOk()) return;
    try { s.json.value = ''; } catch (e) { /* nem kritikus */ }
    setConfirm(null);
    setBusy('Mentés ellenőrzése…');
    P.importBundle(file, { dryRun: true }).then(function (res) {
      if (res.fatal) { backupNote(res.errors[0] && res.errors[0].message || 'A fájl nem olvasható.', true); return null; }
      return P.stats().then(function (st) { return st.count; }, function () { return 0; }).then(function (cur) {
        ui.restore = { file: file, res: res, cur: cur };
        setConfirm('restore');
      });
    }, function (e) {
      backupNote('A fájl nem olvasható: ' + (e && e.message ? e.message : 'ismeretlen hiba') + '.', true);
    }).then(function () { setBusy(null); });
  }
  function doRestore() {
    var r = ui.restore;
    if (!r || ui.busy) return;
    setConfirm(null);
    setBusy('Visszaállítás…');
    P.importBundle(r.file).then(function (res) {
      if (res.fatal) { backupNote(res.errors[0] && res.errors[0].message || 'A visszaállítás nem sikerült.', true); return; }
      setState(res.state);
      ui.restore = null;
      ui.period = 'all'; ui.cat = 'all'; ui.limit = PAGE;
      var msg = 'Visszaállítva: ' + plural(res.expenseCount) + ', ' + L.formatNum(res.photoCount, 0) + ' kép.';
      if (res.errors.length) msg += ' ' + res.errors.length + ' hibás elem kimaradt.';
      render();
      backupNote(msg, false);
      toast('Visszaállítva: ' + plural(res.expenseCount) + ', ' + L.formatNum(res.photoCount, 0) + ' kép.');
    }, function (e) {
      backupNote('A visszaállítás nem sikerült: ' + (e && e.message ? e.message : 'ismeretlen hiba') + '.', true);
    }).then(function () { setBusy(null); });
  }
  function doPrune() {
    if (!photosOk()) return;
    P.pruneOrphans(state).then(function (n) {
      toast(n ? L.formatNum(n, 0) + ' nem használt kép törölve.' : 'Nincs nem használt kép.');
      refreshPhotoStats();
    }, function () { toast('A képek törlése nem sikerült.', true); });
  }
  function resetView() { ui.confirm = null; ui.period = 'all'; ui.cat = 'all'; ui.limit = PAGE; }
  function loadDemo() {
    setState(Object.assign({}, state, { expenses: L.demoData() }));
    resetView();
    render();
    toast('Mintaadatok betöltve.');
  }
  function clearAll() {
    setState(Object.assign({}, state, { expenses: [] }));
    if (photosOk()) P.clear()['catch'](function () { /* nem kritikus */ }).then(refreshPhotoStats);
    resetView();
    render();
    toast('Minden tétel és fotó törölve.');
  }

  /* ---------- Műveletek ---------- */
  function act(name, b) {
    var id = b.getAttribute('data-id'), v = b.getAttribute('data-v');
    if (ui.busy && /^(new|edit|import|demo-load|clear-ask|photo-prune|confirm-yes)$/.test(name)) return;
    switch (name) {
      case 'tab': setTab(v); break;
      case 'new': openExpense(null); break;
      case 'edit': openExpense(id); break;
      case 'period': ui.period = v; ui.limit = PAGE; render(); break;
      case 'cat': ui.cat = v; ui.limit = PAGE; render(); break;
      case 'more': ui.limit += PAGE; render(); break;
      case 'sheet-cancel': closeSheet(); break;
      case 'sheet-save': saveExpense(); break;
      case 'cat-pick': fm.cat = v; clearErrors(); syncCat(); break;
      case 'sheet-del': askDelete(); break;
      case 'sheet-del-no': cancelDelete(); break;
      case 'sheet-del-yes': doDelete(); break;
      case 'rcpt-amount': if (fm) { fm.amount.value = L.formatNum(+v, 0); sizeAmount(); clearErrors(); focusEl(fm.amount); toast('Összeg beírva. Ellenőrizd mentés előtt.'); } break;
      case 'rcpt-liters': if (fm) { fm.liters.value = v; clearErrors(); focusEl(fm.liters); toast('Liter beírva. Ellenőrizd mentés előtt.'); } break;
      case 'station-pick': if (fm) { fm.station.value = v; hideSuggest(); focusEl(fm.station); } break;
      case 'scan': if (fm && fm.sinput) { try { fm.sinput.click(); } catch (er) { toast(CAM_MSG, true); } } break;
      case 'scan-cancel': closeScan(); break;
      case 'scan-use': useScan(); break;
      case 'scan-again': if (sc && sc.input) { try { sc.input.click(); } catch (er2) { toast(CAM_MSG, true); } } break;
      case 'photo-quick': if (fm) openPicker(fm.cinput); break;
      case 'photo-del': delFormPhoto(id); break;
      case 'form-photo': openFormViewer(id, b); break;
      case 'viewer': {
        var e = findExpense(id);
        if (e && e.photoIds && e.photoIds.length) openViewer(e.photoIds.slice(), 0, photoCaption(e.date, e.category), b);
        break;
      }
      case 'viewer-close': closeViewer(); break;
      case 'viewer-prev': viewerStep(-1); break;
      case 'viewer-next': viewerStep(1); break;
      case 'copy': copyCsv(); break;
      case 'import': doImport(); break;
      case 'backup': doBackup(); break;
      case 'restore-pick': if (!ui.busy && els.set.json) els.set.json.click(); break;
      case 'photo-prune': doPrune(); break;
      case 'demo-load':
        if (state.expenses.length && ui.tab === 'settings') setConfirm('demo'); else loadDemo();
        break;
      case 'clear-ask': setConfirm('clear'); break;
      case 'confirm-no': ui.restore = null; setConfirm(null); break;
      case 'confirm-yes': {
        var k = ui.confirm;
        if (k === 'clear') clearAll(); else if (k === 'restore') doRestore(); else loadDemo();
        break;
      }
    }
  }

  /* ---------- Fő rajzolás ---------- */
  function renderCar() {
    var t = [state.car.name, state.car.plate].filter(Boolean).join(', ');
    els.carLine.textContent = t;
    els.carLine.hidden = !t;
  }
  function render() {
    var has = state.expenses.length > 0;
    TABS.forEach(function (t) {
      var on = t.id === ui.tab, b = els.tabs[t.id];
      pages[t.id].el.hidden = !on;
      b.setAttribute('aria-selected', String(on));
      b.tabIndex = on ? 0 : -1;
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    els.fab.hidden = ui.tab === 'settings';
    if (ui.tab === 'overview') {
      renderCar();
      pages.overview.empty.hidden = has;
      pages.overview.main.hidden = !has;
      fillEmpty(pages.overview);
      if (has) {
        var d = compute();
        renderControls();
        renderHero(d);
        drawChart(d);
        drawPrice();
      } else lastD = null;
    } else if (ui.tab === 'items') {
      pages.items.empty.hidden = has;
      pages.items.main.hidden = !has;
      fillEmpty(pages.items);
      if (has) { renderControls(); renderList(compute()); }
    } else refreshSettings();
    syncScroll();
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-act]');
    if (b) act(b.getAttribute('data-act'), b);
  });
  document.addEventListener('pointerdown', function (e) {
    tipHides.forEach(function (x) { if (!x.wrap.contains(e.target)) x.hide(); });
  });
  document.addEventListener('keydown', function (e) {
    if (vw) { viewerKey(e); return; }
    if (sc) { if (e.key === 'Escape') { e.preventDefault(); closeScan(); } return; }
    if (e.key !== 'Escape') return;
    if (!sh) { if (ui.confirm && ui.tab === 'settings') { ui.restore = null; setConfirm(null); } return; }
    if (sh.closing) return;
    if (fm && fm.delConfirm) cancelDelete();
    else closeSheet();
  });
  window.addEventListener('scroll', syncScroll, { passive: true });
  window.addEventListener('hashchange', function () {
    var t = tabFromHash();
    if (t && t !== ui.tab) setTab(t, true);
  });

  build();
  ui.tab = tabFromHash() || 'overview';
  render();
  if (photosOk()) {
    P.ready().then(function (r) {
      ui.persist = !!r.persistent;
      if (ui.tab === 'settings') refreshSettings();
    }, function () { ui.persist = false; });
  }
})();

</script>

      window.addEventListener('load', function () {
